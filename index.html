<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Global College of Missiology — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a24b;
    --gold-light: #f0d78c;
    --gold-deep: #8f6b1f;
    --navy: #0a1024;
    --navy-2: #0e1633;
    --ivory: #f5efe0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--navy);
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Sacred ambient background ---------- */
  .bg {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(ellipse 45% 40% at 28% 30%, rgba(201,162,75,.16), transparent 62%),
      radial-gradient(ellipse 50% 45% at 72% 68%, rgba(28,52,120,.35), transparent 65%),
      radial-gradient(ellipse 35% 30% at 50% 50%, rgba(240,215,140,.07), transparent 60%);
    animation: drift 20s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes drift {
    0%   { transform: translate(0,0) rotate(0deg) scale(1); }
    100% { transform: translate(-3%, 3%) rotate(4deg) scale(1.08); }
  }

  /* Faint light rays from top */
  .rays {
    position: fixed;
    top: -20%;
    left: 50%;
    width: 140vmax;
    height: 140vmax;
    transform: translateX(-50%);
    background: conic-gradient(from 180deg at 50% 0%,
      transparent 0deg, rgba(240,215,140,.05) 8deg, transparent 16deg,
      transparent 40deg, rgba(240,215,140,.04) 48deg, transparent 56deg,
      transparent 90deg, rgba(240,215,140,.05) 98deg, transparent 106deg,
      transparent 140deg, rgba(240,215,140,.04) 148deg, transparent 156deg,
      transparent 200deg, rgba(240,215,140,.05) 208deg, transparent 216deg,
      transparent 260deg, rgba(240,215,140,.04) 268deg, transparent 276deg,
      transparent 320deg, rgba(240,215,140,.05) 328deg, transparent 336deg);
    animation: raysSway 16s ease-in-out infinite alternate;
    pointer-events: none;
    opacity: .8;
  }

  @keyframes raysSway {
    from { transform: translateX(-50%) rotate(-2deg); }
    to   { transform: translateX(-50%) rotate(2deg); }
  }

  /* ---------- Floating light particles ---------- */
  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 5;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(3,5,14,.8) 100%);
    pointer-events: none;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    z-index: 10;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(28px, 5vh, 56px);
    padding: clamp(20px, 4vw, 48px);
    text-align: center;
  }

  /* ---------- Logo ---------- */
  .logo-wrap {
    position: relative;
    opacity: 0;
    transform: scale(.85) translateY(24px);
    animation: logoIn 1.6s cubic-bezier(.16,1,.3,1) .4s forwards;
  }

  @keyframes logoIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .halo {
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,162,75,.3), transparent 65%);
    filter: blur(20px);
    animation: pulse 4.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: .55; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.12); }
  }

  .ring {
    position: absolute;
    inset: -8%;
    border-radius: 50%;
    border: 1px solid rgba(201,162,75,.4);
    animation: spin 16s linear infinite;
  }
  .ring::before {
    content: '';
    position: absolute;
    top: -4px; left: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gold-light);
    box-shadow: 0 0 14px 4px rgba(240,215,140,.85);
    transform: translateX(-50%);
  }
  .ring.r2 {
    inset: -15%;
    border-color: rgba(201,162,75,.16);
    animation-duration: 26s;
    animation-direction: reverse;
  }
  .ring.r2::before {
    width: 5px; height: 5px;
    background: var(--gold);
    box-shadow: 0 0 10px 3px rgba(201,162,75,.7);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-wrap img {
    display: block;
    width: clamp(150px, 34vmin, 300px);
    height: auto;
    border-radius: 50%;
    position: relative;
    filter: drop-shadow(0 0 28px rgba(201,162,75,.5));
    animation: floaty 5.5s ease-in-out infinite;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  /* ---------- Wordmark ---------- */
  .wordmark {
    opacity: 0;
    animation: fadeUp 1.5s ease 1.3s forwards;
  }

  .wordmark .over {
    display: block;
    font-family: 'Marcellus', serif;
    font-size: clamp(.6rem, 1.8vmin, .85rem);
    letter-spacing: .6em;
    text-indent: .6em;
    text-transform: uppercase;
    color: rgba(240,215,140,.65);
    margin-bottom: clamp(8px, 1.4vh, 14px);
  }

  .wordmark .name {
    display: block;
    font-family: 'Marcellus', serif;
    font-weight: 400;
    font-size: clamp(1.5rem, 5.4vmin, 3rem);
    letter-spacing: .18em;
    text-indent: .18em;
    text-transform: uppercase;
    color: var(--ivory);
    text-shadow: 0 0 30px rgba(201,162,75,.4);
  }

  .wordmark .under {
    display: block;
    margin-top: clamp(8px, 1.4vh, 14px);
    font-style: italic;
    font-size: clamp(.85rem, 2.4vmin, 1.1rem);
    color: rgba(245,239,224,.55);
    letter-spacing: .08em;
  }

  /* Ornamental divider ✦ */
  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    animation: fadeUp 1.4s ease 1.6s forwards;
  }
  .ornament span {
    height: 1px;
    width: clamp(40px, 10vmin, 90px);
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .ornament span:last-child {
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .ornament i {
    font-style: normal;
    color: var(--gold);
    font-size: clamp(.8rem, 2vmin, 1rem);
    text-shadow: 0 0 12px rgba(240,215,140,.9);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Let's Explore link ---------- */
  .explore {
    position: relative;
    opacity: 0;
    animation: fadeUp 1.5s ease 2s forwards;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: clamp(8px, 1.6vmin, 14px);
    padding: clamp(14px, 2.4vmin, 20px) clamp(28px, 6vmin, 52px);
    font-family: 'Marcellus', serif;
    font-size: clamp(.78rem, 2.2vmin, 1.05rem);
    letter-spacing: .38em;
    text-indent: .38em;
    text-transform: uppercase;
    color: var(--gold-light);
    border: 1px solid rgba(201,162,75,.5);
    border-radius: 999px;
    background: linear-gradient(120deg, rgba(201,162,75,.05), rgba(201,162,75,.16), rgba(201,162,75,.05));
    background-size: 230% 100%;
    transition: color .4s, box-shadow .5s, background-position .9s ease;
    overflow: hidden;
    cursor: pointer;
    will-change: transform;
  }

  .explore::before {
    content: '';
    position: absolute;
    top: 0; left: -80%;
    width: 55%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.4), transparent);
    transform: skewX(-20deg);
    transition: left .8s ease;
  }

  .explore:hover, .explore:focus-visible {
    color: #fff;
    background-position: 100% 0;
    box-shadow: 0 0 40px rgba(201,162,75,.55), inset 0 0 20px rgba(201,162,75,.28);
    outline: none;
  }

  .explore:hover::before,
  .explore:focus-visible::before { left: 135%; }

  .explore .arrow {
    display: inline-block;
    transition: transform .45s cubic-bezier(.34,1.56,.64,1);
  }
  .explore:hover .arrow,
  .explore:focus-visible .arrow { transform: translateX(8px); }

  /* ---------- Bottom verse line ---------- */
  .verse {
    position: absolute;
    bottom: clamp(16px, 3.5vh, 36px);
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 560px);
    font-style: italic;
    font-size: clamp(.72rem, 1.9vmin, .9rem);
    letter-spacing: .14em;
    color: rgba(245,239,224,.45);
    opacity: 0;
    animation: fadeUp 1.6s ease 2.6s forwards;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .verse::before {
    content: '';
    display: block;
    margin: 0 auto clamp(8px, 1.2vh, 12px);
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: lineGrow 1.6s ease 2.4s forwards;
  }

  @keyframes lineGrow {
    to { width: min(300px, 55vw); }
  }

  /* ---------- Transition veil ---------- */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: radial-gradient(circle at center, #141d3d, #02040c);
    opacity: 0;
    pointer-events: none;
    transition: opacity .85s ease;
  }
  .veil.active { opacity: 1; pointer-events: all; }

  /* ---------- Touch devices: disable magnetic hover ---------- */
  @media (hover: none) {
    .explore { transition: box-shadow .4s, background-position .9s ease; }
  }

  /* ---------- Small phones ---------- */
  @media (max-width: 480px) {
    .stage { gap: 24px; }
    .logo-wrap img { width: clamp(140px, 44vw, 200px); }
    .verse { white-space: normal; }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01s !important;
      animation-delay: 0s !important;
      transition-duration: .2s !important;
    }
  }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="rays"></div>
  <canvas id="particles"></canvas>
  <div class="vignette"></div>

  <main class="stage">
    <div class="logo-wrap">
      <div class="halo"></div>
      <div class="ring"></div>
      <div class="ring r2"></div>
      <!-- Replace src with your college logo image -->
      <img src="./img/logo/logo.png" alt="Global College of Missiology Logo" id="logoImg" />
    </div>

    <header class="wordmark">
      <span class="over">Welcome to</span>
      <span class="name">Global College of Missiology</span>
      <span class="under">Equipping saints for the harvest fields of the world</span>
    </header>

    <div class="ornament">
      <span></span><i>✦</i><span></span>
    </div>

    <a href="./home.html" class="explore" id="exploreLink">
      Let's Explore <span class="arrow">→</span>
    </a>

   
  </main>

  <div class="veil" id="veil"></div>

<script>
  /* ---------- Floating light particles ---------- */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let W, H;
  const particles = [];
  const COUNT = Math.min(110, Math.floor(innerWidth / 12)); // auto-density per screen

  function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
  }
  resize();
  addEventListener('resize', resize);

  function spawn(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 10,
      r: Math.random() * 1.7 + 0.4,
      vy: -(Math.random() * 0.32 + 0.08),
      vx: (Math.random() - 0.5) * 0.14,
      alpha: Math.random() * 0.55 + 0.12,
      tw: Math.random() * Math.PI * 2
    };
  }

  for (let i = 0; i < COUNT; i++) particles.push(spawn(true));

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.tw += 0.03;
      p.x += p.vx;
      p.y += p.vy;
      const a = p.alpha * (0.6 + 0.4 * Math.sin(p.tw));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(240,215,140,${a})`;
      ctx.shadowColor = 'rgba(240,215,140,.9)';
      ctx.shadowBlur = 6;
      ctx.fill();
      if (p.y < -12 || p.x < -12 || p.x > W + 12) Object.assign(p, spawn(false));
    }
    requestAnimationFrame(draw);
  }
  draw();

  /* ---------- Magnetic "Let's Explore" (fine pointers only) ---------- */
  const link = document.getElementById('exploreLink');
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const STRENGTH = 26;

  if (fine) {
    document.addEventListener('mousemove', e => {
      const rect = link.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.hypot(dx, dy);

      if (dist < 140 && dist > 0) {
        const pull = (1 - dist / 140) * STRENGTH;
        link.style.transform = `translate(${dx / dist * pull}px, ${dy / dist * pull}px)`;
      } else {
        link.style.transform = 'translate(0,0)';
      }
    });
  }

  /* ---------- Smooth veil transition on click ---------- */
  link.addEventListener('click', e => {
    e.preventDefault();
    const veil = document.getElementById('veil');
    veil.classList.add('active');
    setTimeout(() => {
      window.location.href = link.getAttribute('href');
    }, 880);
  });

  /* ---------- Graceful logo fallback: golden "GCM" seal ---------- */
  const logoImg = document.getElementById('logoImg');
  logoImg.addEventListener('error', () => {
    const seal = document.createElement('div');
    seal.style.cssText = `
      width: clamp(150px, 34vmin, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid rgba(201,162,75,.65);
      background: radial-gradient(circle at 35% 28%, #1c2a52, #0a1024 70%);
      box-shadow: 0 0 40px rgba(201,162,75,.4), inset 0 0 34px rgba(201,162,75,.18);
      position: relative;`;
    seal.innerHTML = `
      <span style="font-family:'Marcellus',serif;font-size:clamp(2.2rem,10vmin,4rem);
        color: var(--gold-light); text-shadow: 0 0 24px rgba(201,162,75,.85);
        letter-spacing:.05em;">GCM</span>
      <span style="font-size:clamp(.55rem,1.6vmin,.75rem);letter-spacing:.4em;
        text-indent:.4em;color:rgba(240,215,140,.7);text-transform:uppercase;
        margin-top:6px;">Est. In Christ</span>
      <span style="position:absolute;top:8%;left:50%;transform:translateX(-50%);
        color:rgba(240,215,140,.8);font-size:clamp(.7rem,2vmin,1rem);">✝</span>`;
    logoImg.replaceWith(seal);
  });
</script>
</body>
</html>
